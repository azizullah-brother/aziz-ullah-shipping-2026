<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aziz Ullah & Brother | Import Export</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#172033;font:14px Arial,sans-serif}
header{background:linear-gradient(120deg,#102b4e,#176b87);color:#fff;padding:22px 16px}
header h1{margin:0 0 6px;font-size:22px}header p{margin:0;color:#dcecf5}
main{max-width:1500px;margin:18px auto;padding:0 12px}
.panel{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #14213d0b}
#loginGate{min-height:65vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{width:min(420px,100%);background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 30px #14213d18}
.login h2{margin-top:0}.login input{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px}
button{border:0;border-radius:8px;padding:10px 14px;background:#176b87;color:#fff;font-weight:600;cursor:pointer;margin:3px}
button.secondary{background:#526174}button.danger{background:#b42318}button:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.toolbar input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;flex:1;min-width:180px}
#notice{margin-top:10px;color:#526174;font-size:13px}
.tablebox{overflow:auto;max-height:68vh;border:1px solid #dce3eb;border-radius:8px}
table{border-collapse:collapse;min-width:2100px;width:100%;background:#fff}
th,td{border:1px solid #dce3eb;padding:6px;text-align:left;white-space:nowrap}
th{background:#eaf1f6;position:sticky;top:0;z-index:1}
td input{width:125px;padding:7px;border:1px solid #d4dce5;border-radius:5px}
td input:focus{outline:2px solid #72b6ce;border-color:#176b87}
td:first-child,th:first-child{position:sticky;left:0;background:#f5f8fb;z-index:2}
.empty{padding:22px;text-align:center;color:#68778a}
.small{font-size:12px;color:#64748b}
#error{color:#b42318;min-height:18px;margin-top:8px}
#app{display:none}
@media print{header,.toolbar,#notice,.no-print{display:none!important}main{max-width:none;margin:0;padding:0}.panel{border:0;box-shadow:none;padding:0}.tablebox{max-height:none;overflow:visible}table{min-width:0;font-size:8px}th,td{white-space:normal;padding:3px}td input{border:0;width:auto;padding:0}}
</style>
</head>
<body>
<header><h1>Aziz Ullah &amp; Brother</h1><p>Import Export Management</p></header>

<section id="loginGate">
  <div class="login">
    <h2>Sign in</h2>
    <p class="small">Please sign in with your approved account.</p>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email address" autocomplete="username" required>
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
      <button id="loginBtn" type="submit" style="width:100%">Login</button>
    </form>
    <div id="error" role="alert"></div>
  </div>
</section>

<div id="app">
<main>
  <section class="panel">
    <div class="toolbar">
      <button id="addBtn" class="admin-only">＋ Add Record</button>
      <button id="exportBtn" class="secondary">Export for Excel (CSV)</button>
      <button id="printBtn" class="secondary">Print</button>
      <button id="logoutBtn" class="danger">Logout</button>
      <input id="search" type="search" placeholder="Search all records...">
    </div>
    <div id="notice"></div>
  </section>
  <section class="panel">
    <div class="tablebox" id="tablebox">
      <table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
    </div>
    <p class="small">Tip: Admin can edit cells directly. Changes are saved to Firebase automatically.</p>
  </section>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAZwKw34VPC9x4U9DaSIWqbnPoNMwDGBSc",
  authDomain: "aziz-ullah.firebaseapp.com",
  databaseURL: "https://aziz-ullah-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aziz-ullah",
  storageBucket: "aziz-ullah.firebasestorage.app",
  messagingSenderId: "989075859123",
  appId: "1:989075859123:web:9d24d0eec875f90ddf72c6",
  measurementId: "G-GPM3NYN1HP"
};

const ADMIN_UID = "e5PWQr2cmXUnBJzFZ6GTgbMfW122";
const cols = ['Date','CONT No','QTY','SIZE','Brand Name','RAT ($)','Rat CNT','PARTY','SHIPMENT','ETA Date','Crop','Consignee','B/L No','Container Number','Godam','Recd Date','Payment Detail','Tax','Dubai party','FCL No','Lot No','PV No'];

let auth, db, currentRole='guest', records=[], remoteLoading=false, firebaseReady=false;
const $ = id => document.getElementById(id);
function showError(msg){ $('error').textContent=msg||''; }
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setLogin(show){$('loginGate').style.display=show?'flex':'none';$('app').style.display=show?'none':'block';}
function applyRoleUI(){
  const admin=currentRole==='admin';
  document.querySelectorAll('.admin-only').forEach(el=>el.style.display=admin?'inline-block':'none');
  $('notice').innerHTML=admin
    ? '<b>Online database:</b> Signed in as Admin. Changes sync to Firebase when internet is available.'
    : '<b>View-only account:</b> You can search, filter, export and print records. Editing is disabled.';
}
function render(){
  $('head').innerHTML='<th>S.No</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+(currentRole==='admin'?'<th>Action</th>':'');
  const q=$('search').value.trim().toLowerCase();
  const visible=records.map((r,i)=>({r,i})).filter(x=>!q||cols.some(c=>String(x.r[c]??'').toLowerCase().includes(q)));
  if(!visible.length){$('body').innerHTML='<tr><td class="empty" colspan="'+(cols.length+2)+'">No records found.</td></tr>';return;}
  $('body').innerHTML=visible.map(({r,i})=>'<tr><td>'+(i+1)+'</td>'+
    cols.map(c=>'<td>'+(currentRole==='admin'
      ? '<input aria-label="'+esc(c)+'" data-row="'+i+'" data-col="'+esc(c)+'" value="'+esc(r[c]??'')+'">'
      : esc(r[c]??''))+'</td>').join('')+
    (currentRole==='admin'?'<td><button class="danger delete-row" data-row="'+i+'">Delete</button></td>':'')+'</tr>').join('');
}
async function save(){
  if(!firebaseReady||currentRole!=='admin'||remoteLoading)return;
  try{await db.ref('records').set(records);}
  catch(err){alert('Firebase save failed: '+err.message);}
}
async function addRow(){
  if(currentRole!=='admin')return;
  records.push(Object.fromEntries(cols.map(c=>[c,''])));
  render();
  const box=$('tablebox');box.scrollTop=box.scrollHeight;
  await save();
}
async function deleteRow(i){
  if(currentRole!=='admin'||!confirm('Delete record #'+(i+1)+'?'))return;
  records.splice(i,1);render();await save();
}
$('body').addEventListener('change',async e=>{
  const input=e.target.closest('input[data-row][data-col]');
  if(!input||currentRole!=='admin')return;
  const i=Number(input.dataset.row), c=input.dataset.col;
  if(!records[i])return;
  records[i][c]=input.value;
  await save();
});
$('body').addEventListener('click',e=>{
  const btn=e.target.closest('.delete-row');
  if(btn)deleteRow(Number(btn.dataset.row));
});
$('addBtn').addEventListener('click',addRow);
$('search').addEventListener('input',render);
$('exportBtn').addEventListener('click',()=>{
  const q=$('search').value.trim().toLowerCase();
  const rows=records.filter(r=>!q||cols.some(c=>String(r[c]??'').toLowerCase().includes(q)));
  const csv=[cols,...rows.map(r=>cols.map(c=>r[c]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Aziz-Ullah-Brother-Records.csv';a.click();URL.revokeObjectURL(url);
});
$('printBtn').addEventListener('click',()=>window.print());
$('logoutBtn').addEventListener('click',()=>auth.signOut());

async function startApp(user){
  try{
    if(user.uid===ADMIN_UID){currentRole='admin';}
    else{
      const roleSnap=await db.ref('roles/'+user.uid+'/role').once('value');
      if(roleSnap.val()!=='viewer'){
        currentRole='guest';await auth.signOut();setLogin(true);
        showError('This account has not been approved as a viewer.');return;
      }
      currentRole='viewer';
    }
    applyRoleUI();setLogin(false);
    db.ref('records').off();
    db.ref('records').on('value',snap=>{
      remoteLoading=true;
      const val=snap.val();
      records=Array.isArray(val)?val.filter(Boolean):[];
      remoteLoading=false;firebaseReady=true;render();
    },err=>{console.error(err);showError('Database access error: '+err.message);});
  }catch(err){console.error(err);showError('App setup failed: '+err.message);}
}

try{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();db=firebase.database();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(console.error);
  auth.onAuthStateChanged(user=>{
    if(user){showError('');startApp(user);}
    else{currentRole='guest';firebaseReady=false;db.ref('records').off();setLogin(true);}
  });
}catch(err){showError('Firebase connection failed: '+err.message);}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!auth||!db){showError('Firebase connection failed. Reload the page and try again.');return;}
  const email=$('loginEmail').value.trim(),password=$('loginPassword').value;
  showError('Connecting…');$('loginBtn').disabled=true;
  try{await auth.signInWithEmailAndPassword(email,password);}
  catch(err){showError('Login failed: '+err.message);}
  finally{$('loginBtn').disabled=false;}
});
</script>
</body>
</html>
